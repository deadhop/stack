# Production deployment: the payment service, an offline wallet service and
# the dashboard.
#
# The payment service has no inbound port: it reaches out to Nostr relays and
# to your Electrum server. It is watch-only and never holds a spending key.
# Only the dashboard (static files) is served over HTTP; TLS for it is
# terminated by the reverse proxy in front (Coolify/Traefik).
#
# Wallet: leave DEADHOP_XPUB unset and the `wallet` service (no network at all)
# generates a wallet on first start, keeps its recovery phrase in its own
# volume and hands only the public key to the payment service. Back up the
# phrase with `docker compose exec wallet deadhop wallet export`. Or set
# DEADHOP_XPUB to your own wallet's account key and nothing is generated.
#
# Sweeping (opt-in): the `sweeper` service (deadhop-wallet) holds the funds
# and, once the confirmed balance reaches DEADHOP_WALLET_THRESHOLD_SAT, moves
# them to a fresh address of another wallet (DEADHOP_WALLET_DESTINATION) by a
# simple send, a PayJoin or a CoinJoin. It needs network access (Electrum,
# and the PayJoin receiver or the CoinJoin relay), so it is a separate
# service the offline wallet stays out of, and it only starts with
# `docker compose --profile sweep up -d`. With nothing to sweep to (no
# destination, and in payjoin mode no URI file) it reads no key and makes no
# connection. For payjoin, mount the URI file read-only from the host (see
# the commented volume below): whoever can write it decides where the whole
# balance goes.
#
# Every variable is passed through empty when unset, which the service treats
# as unset. DEADHOP_ELECTRUM and DEADHOP_ADMINS (or DEADHOP_PUBLIC_INVOICING=true)
# are required: without them the service exits with a message naming the
# missing variable and is restarted until they are set. The dashboard comes up
# regardless.
services:
  wallet:
    build:
      context: ./server
    command: ["wallet", "serve"]
    restart: unless-stopped
    network_mode: none
    environment:
      DEADHOP_XPUB: "${DEADHOP_XPUB:-}"
      DEADHOP_NETWORK: "${DEADHOP_NETWORK:-bitcoin}"
      DEADHOP_DATA_DIR: /wallet
      DEADHOP_XPUB_FILE: /wallet-public/account.xpub
      TOKIO_WORKER_THREADS: "1"
    volumes:
      - cvmpay-wallet:/wallet
      - cvmpay-wallet-public:/wallet-public
    healthcheck:
      test: ["CMD", "test", "-e", "/wallet-public/ready"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32
    labels:
      - traefik.enable=false

  deadhop:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DEADHOP_RELAYS: "${DEADHOP_RELAYS:-wss://relay.contextvm.org,wss://nos.lol,wss://relay.damus.io}"
      DEADHOP_ELECTRUM: "${DEADHOP_ELECTRUM:-}"
      DEADHOP_ELECTRUM_CERT_SHA256: "${DEADHOP_ELECTRUM_CERT_SHA256:-}"
      DEADHOP_XPUB: "${DEADHOP_XPUB:-}"
      DEADHOP_NETWORK: "${DEADHOP_NETWORK:-bitcoin}"
      DEADHOP_ADMINS: "${DEADHOP_ADMINS:-}"
      DEADHOP_PUBLIC_INVOICING: "${DEADHOP_PUBLIC_INVOICING:-}"
      DEADHOP_POW_BITS: "${DEADHOP_POW_BITS:-}"
      DEADHOP_MIN_CONFIRMATIONS: "${DEADHOP_MIN_CONFIRMATIONS:-}"
      DEADHOP_PROXY: "${DEADHOP_PROXY:-}"
      DEADHOP_PROXIES: "${DEADHOP_PROXIES:-}"
      DEADHOP_PROXY_MODE: "${DEADHOP_PROXY_MODE:-}"
      DEADHOP_PROXY_ROTATE_SECS: "${DEADHOP_PROXY_ROTATE_SECS:-}"
      DEADHOP_PROXY_CHAOS_MIN_SECS: "${DEADHOP_PROXY_CHAOS_MIN_SECS:-}"
      DEADHOP_PROXY_CHAOS_MAX_SECS: "${DEADHOP_PROXY_CHAOS_MAX_SECS:-}"
      DEADHOP_PROXY_OFFLINE: "${DEADHOP_PROXY_OFFLINE:-}"
      DEADHOP_TRANSPARENT_PROXY: "${DEADHOP_TRANSPARENT_PROXY:-}"
      DEADHOP_PROXY_LOCKED: "${DEADHOP_PROXY_LOCKED:-}"
      DEADHOP_NAME: "${DEADHOP_NAME:-}"
      DEADHOP_ANNOUNCE: "${DEADHOP_ANNOUNCE:-}"
      DEADHOP_LOG: "${DEADHOP_LOG:-}"
      DEADHOP_DEFAULT_EXPIRY_SECS: "${DEADHOP_DEFAULT_EXPIRY_SECS:-}"
      DEADHOP_LATE_GRACE_SECS: "${DEADHOP_LATE_GRACE_SECS:-}"
      DEADHOP_MAX_AMOUNT_SAT: "${DEADHOP_MAX_AMOUNT_SAT:-}"
      DEADHOP_MAX_EXPIRY_SECS: "${DEADHOP_MAX_EXPIRY_SECS:-}"
      DEADHOP_MAX_INVOICES_PER_DAY: "${DEADHOP_MAX_INVOICES_PER_DAY:-}"
      DEADHOP_MAX_OPEN_INVOICES: "${DEADHOP_MAX_OPEN_INVOICES:-}"
      DEADHOP_MIN_AMOUNT_SAT: "${DEADHOP_MIN_AMOUNT_SAT:-}"
      DEADHOP_POLL_SECS: "${DEADHOP_POLL_SECS:-}"
      DEADHOP_POW_WINDOW_SECS: "${DEADHOP_POW_WINDOW_SECS:-}"
      DEADHOP_RATE_GLOBAL_PER_MIN: "${DEADHOP_RATE_GLOBAL_PER_MIN:-}"
      DEADHOP_RATE_PER_KEY_PER_MIN: "${DEADHOP_RATE_PER_KEY_PER_MIN:-}"
      DEADHOP_RATE_REQUESTS_PER_KEY_PER_MIN: "${DEADHOP_RATE_REQUESTS_PER_KEY_PER_MIN:-}"
      DEADHOP_RATE_REQUESTS_PER_MIN: "${DEADHOP_RATE_REQUESTS_PER_MIN:-}"
      DEADHOP_DATA_DIR: /data
      # The service writes the relays each key listens on here (relays.json),
      # so that the dashboard follows relay changes made from the dashboard.
      DEADHOP_PUBLIC_DIR: /public
      DEADHOP_XPUB_FILE: /wallet-public/account.xpub
      # The address high-water mark, for the sweeper's scan.
      DEADHOP_INDEX_FILE: /wallet-scan/next-index
    depends_on:
      wallet:
        condition: service_healthy
    volumes:
      - cvmpay-data:/data
      - cvmpay-public:/public
      - cvmpay-wallet-public:/wallet-public:ro
      - deadhop-wallet-scan:/wallet-scan
    # Healthy once the service has connected to its relays and is serving
    # (it writes server.pubkey into the data directory at that point).
    healthcheck:
      test: ["CMD", "test", "-s", "/data/server.pubkey"]
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 3
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    labels:
      - traefik.enable=false

  sweeper:
    profiles: ["sweep"]
    build:
      # Cargo fetches the shared crates from deadhop/server while building,
      # so this image builds only once that repository is public.
      context: ./wallet
    restart: unless-stopped
    depends_on:
      wallet:
        condition: service_healthy
    environment:
      DEADHOP_XPUB: "${DEADHOP_XPUB:-}"
      DEADHOP_NETWORK: "${DEADHOP_NETWORK:-bitcoin}"
      DEADHOP_ELECTRUM: "${DEADHOP_ELECTRUM:-}"
      DEADHOP_ELECTRUM_CERT_SHA256: "${DEADHOP_ELECTRUM_CERT_SHA256:-}"
      DEADHOP_WALLET_MODE: "${DEADHOP_WALLET_MODE:-}"
      DEADHOP_WALLET_DESTINATION: "${DEADHOP_WALLET_DESTINATION:-}"
      DEADHOP_WALLET_THRESHOLD_SAT: "${DEADHOP_WALLET_THRESHOLD_SAT:-}"
      DEADHOP_WALLET_MAX_FEE_RATE: "${DEADHOP_WALLET_MAX_FEE_RATE:-}"
      DEADHOP_WALLET_FEE_TARGET_BLOCKS: "${DEADHOP_WALLET_FEE_TARGET_BLOCKS:-}"
      DEADHOP_WALLET_MIN_CONFIRMATIONS: "${DEADHOP_WALLET_MIN_CONFIRMATIONS:-}"
      DEADHOP_WALLET_POLL_SECS: "${DEADHOP_WALLET_POLL_SECS:-}"
      DEADHOP_WALLET_GAP: "${DEADHOP_WALLET_GAP:-}"
      DEADHOP_WALLET_MAX_INDEX_HINT: "${DEADHOP_WALLET_MAX_INDEX_HINT:-}"
      DEADHOP_WALLET_PROXY: "${DEADHOP_WALLET_PROXY:-}"
      DEADHOP_WALLET_PAYJOIN_URI_FILE: "${DEADHOP_WALLET_PAYJOIN_URI_FILE:-}"
      DEADHOP_WALLET_PAYJOIN_CERT_SHA256: "${DEADHOP_WALLET_PAYJOIN_CERT_SHA256:-}"
      DEADHOP_WALLET_COINJOIN_RELAY: "${DEADHOP_WALLET_COINJOIN_RELAY:-}"
      DEADHOP_WALLET_COINJOIN_DENOMINATION_SAT: "${DEADHOP_WALLET_COINJOIN_DENOMINATION_SAT:-}"
      DEADHOP_WALLET_COINJOIN_PEERS: "${DEADHOP_WALLET_COINJOIN_PEERS:-}"
      DEADHOP_WALLET_COINJOIN_TIMEOUT_SECS: "${DEADHOP_WALLET_COINJOIN_TIMEOUT_SECS:-}"
      DEADHOP_LOG: "${DEADHOP_LOG:-}"
      DEADHOP_DATA_DIR: /wallet
      DEADHOP_XPUB_FILE: /wallet-public/account.xpub
      DEADHOP_INDEX_FILE: /wallet-scan/next-index
      DEADHOP_WALLET_STATE_DIR: /state
    volumes:
      # The recovery phrase, read only: this service never creates or changes it.
      - cvmpay-wallet:/wallet:ro
      - cvmpay-wallet-public:/wallet-public:ro
      - deadhop-wallet-scan:/wallet-scan:ro
      - deadhop-sweeper:/state
      # payjoin mode: the receiver's URI, written on the host for each sweep.
      # - ./payjoin:/payjoin:ro    (and DEADHOP_WALLET_PAYJOIN_URI_FILE=/payjoin/uri)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    labels:
      - traefik.enable=false

  dashboard:
    build:
      context: ./js
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      deadhop:
        condition: service_started
    environment:
      DEADHOP_RELAYS: "${DEADHOP_RELAYS:-wss://relay.contextvm.org,wss://nos.lol,wss://relay.damus.io}"
      DEADHOP_DASHBOARD_RELAYS: "${DEADHOP_DASHBOARD_RELAYS:-}"
      # Only needed when the administration key uses other relays than the public key.
      DEADHOP_DASHBOARD_ADMIN_RELAYS: "${DEADHOP_DASHBOARD_ADMIN_RELAYS:-}"
    expose:
      - "8080"
    volumes:
      - cvmpay-public:/public:ro
    tmpfs:
      - /tmp:size=4m,uid=101,gid=101,mode=0755
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/config.json"]
      interval: 15s
      timeout: 3s
      start_period: 150s
      retries: 3

# These volumes keep the project's old name (cvmpay) on purpose: Docker and
# Coolify name volumes after these keys, so renaming one would start that
# service on an empty volume, with a new service key or wallet.
volumes:
  cvmpay-data:
  cvmpay-public:
  cvmpay-wallet:
  cvmpay-wallet-public:
  deadhop-wallet-scan:
  deadhop-sweeper:
